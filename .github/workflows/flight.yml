name: flight-deal-watcher

on:
  schedule:
    - cron: "7 0 * * *"   # 매일 09:07 KST (UTC 00:07). 실제 실행은 몇 분~수십 분 늦어질 수 있음
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: run
        options: [run, insights, test-claude, test-email]

permissions:
  contents: write          # flight/data/ 기록을 커밋하기 위해 필요
  id-token: write          # Claude API 페더레이션 인증용 OIDC 토큰 발급

concurrency:
  group: flight-deal-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flight
    env:
      # Claude API: API 키 대신 워크로드 ID 페더레이션 (Console 규칙 chungpae-watch-flight)
      # 이 ID들은 비밀값이 아님. 규칙이 이 저장소의 main 브랜치로 고정돼 있어 다른 곳에서는 쓸 수 없음
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_015Mb73brcpUgZZXTRAk4mZT
      ANTHROPIC_ORGANIZATION_ID: 4e79a408-c817-44a8-9459-6983d862d88e
      ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ github.workspace }}/../gha-oidc-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flight/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # 공연 감시용으로 등록해 둔 메일 Secret을 그대로 사용
          GMAIL_USER: ${{ secrets.SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.EMAIL_TO }}
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            test-claude) python monitor.py --test-claude ;;
            test-email)  python monitor.py --test-email ;;
            insights)    python monitor.py --insights 5 ;;
            *)           python monitor.py ;;
          esac

      - name: Commit price history
        if: ${{ contains(fromJSON('["run","insights"]'), inputs.mode || 'run') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "flight: $(date -u +%F) price history"
          # 공연 감시 워크플로가 수시로 푸시하므로 충돌 시 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
