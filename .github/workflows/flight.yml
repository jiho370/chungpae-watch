name: flight-deal-watcher

on:
  schedule:
    - cron: "7 0 * * *"   # 매일 09:07 KST (UTC 00:07). 실제 실행은 몇 분~수십 분 늦어질 수 있음
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write          # flight/data/ 기록을 커밋하기 위해 필요

concurrency:
  group: flight-deal-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flight/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 공연 감시용으로 등록해 둔 메일 Secret을 그대로 사용
          GMAIL_USER: ${{ secrets.SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Commit price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "flight: $(date -u +%F) price history"
          # 공연 감시 워크플로가 수시로 푸시하므로 충돌 시 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
