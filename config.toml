# 청패 공연 감시 설정 파일
# 이 파일만 고치면 동작이 바뀝니다. (TOML 형식: 문자열은 "따옴표", 목록은 [ ... ])

[schedule]
# 시간은 모두 한국 시간(KST)입니다.

# ── 업무시간: 새 공연 목록 확인 + 저가석이 넉넉한 공연 확인 ──
# 이 시간 밖에서는 새 공연을 찾지 않습니다(다음 업무시간에 한꺼번에 알림).
business_days = ["월", "화", "수", "목", "금"]
business_hours = ["09:00", "18:00"]
business_interval_min = 30
plenty_threshold = 20          # 저가석 합계가 이 수 이상이면 '넉넉함'

# ── 저가석 매진 공연(취소표 감시) 확인 간격 ──
# 아래 시간대에 해당하면 그 간격, 아니면 soldout_default_min. every_min = 0이면 확인하지 않음.
# ※ 실제 실행 시각은 .github/workflows/watch.yml의 cron이 정합니다(지금 값에 맞춰 둠).
#   간격을 더 짧게 바꾸려면 cron도 같이 바꿔야 합니다.
soldout_default_min = 5
# 5분 주기 시간대에 실행 간격이 이 분 수를 넘으면 '실행 주기' 오류 메일(트리거 멈춤·토큰 만료 감지)
gap_alert_min = 30
soldout_intervals = [
  { from = "01:00", to = "03:00", every_min = 60 },
  { from = "03:00", to = "07:00", every_min = 0 },    # 쉬는 시간
  { from = "07:00", to = "08:00", every_min = 30 },
]
# 요청 사이 대기(초). 사이트 부담을 줄이기 위한 값이라 너무 줄이지 마세요.
request_delay_sec = 0.7

[mail]
subject_prefix = "[청패알림]"
# 받는 주소. 비워 두면 보내는 지메일 주소(GMAIL_USER)로 보냅니다.
to = ""

[chungpae]
# 청패 목록에서 볼 장르. 003=클래식/오페라, 001=뮤지컬, 002=연극, 004=발레/무용, 005=국악, 006=전시
genres = ["003"]

[filter]
# 이 공연장 이름이 포함된 공연만 봅니다.
venues = ["롯데콘서트홀", "예술의전당 콘서트홀"]

# 이 날짜 이후에 시작하는 공연은 제외 (청패 포인트 사용 기한)
until = "2027-03-31"

# 공연명/주최에 이 단어가 있으면 무조건 제외 (어린이·가족용 공연 등)
exclude_keywords = ["어린이", "키즈", "아이와", "가족음악회", "청소년음악회"]

# 이 이름이 들어간 좌석 등급은 무시 (가짜·특수 등급)
exclude_grade_keywords = ["테스트", "휠체어", "장애"]

# ── 등급(티어) ──
# 위에서부터 차례로 검사해서 처음 맞는 티어를 적용합니다.
# max_price: 이 가격 이하 좌석 등급을 '저가석'으로 봅니다. (새 공연 알림·취소표 감시 모두 이 기준)
# always_notify: true면 저가석이 없어도 새 공연 알림을 보냅니다.

[[filter.tiers]]
name = "서울시향"
keywords = ["서울시향", "서울시립교향악단"]
max_price = 20000
always_notify = true

[[filter.tiers]]
name = "국내 상위권"
keywords = [
  "KBS교향악단", "경기필", "국립심포니", "부천필", "고잉홈", "국립합창단",
]
# (선택) 이름이 맞아도 NOL 찜 수가 이 미만이면 보류했다가 기준을 넘을 때 알림. 0이면 끔.
# 막 올라온 공연은 찜이 적어 알림이 늦어지므로 기본은 끔.
min_pinned = 0
max_price = 20000
always_notify = false

[[filter.tiers]]
name = "해외·스타·영화음악"
# 연주자·단체 이름과 영화음악 키워드 (공연명/주최에서 찾음)
keywords = [
  # 연주자 (독주회 포함)
  "조성진", "임윤찬", "손열음", "선우예권", "김선욱", "클라라 주미 강", "양인모", "김봄소리",
  "용재 오닐", "정명훈", "아르헤리치", "캉토로프", "하델리히",
  # 해외 단체
  "빈 필", "베를린 필", "콘세르트헤바우", "BBC 필하모닉", "이 무지치",
  # 영화음악
  "영화음악", "OST", "인 콘서트", "지브리", "디즈니", "히사이시", "한스 짐머", "존 윌리엄스",
]
# 키워드가 없어도 최고가 좌석이 이 가격 이상이면 대형 내한 공연으로 봅니다. 0이면 끔.
min_top_price = 220000
# 유명 공연은 2만 원짜리 자리가 거의 없으므로 '가장 싼 등급'만 감시하고, 그 등급이 max_price 이하일 때만 대상
cheapest_only = true
max_price = 50000
always_notify = false

[popularity]
# 이름에 안 걸린 공연이라도 NOL 찜 수가 이만큼 넘으면 '유명 공연'으로 보고,
# 아래 티어(기본: 해외·스타·영화음악)와 같은 기준(가장 싼 등급, 5만 원 상한)을 적용합니다.
# 찜 수는 올라온 뒤에 늘어나므로 주기적으로 다시 확인합니다.
enabled = true
pinned_threshold = 300
tier = "해외·스타·영화음악"
check_interval_hours = 3

[watch]
# 자동 대상 외에 직접 지정할 공연 (NOL 상품코드 = nol.yanolja.com/ticket/products/ 뒤의 숫자)
# 직접 지정한 공연은 공연장·가격 조건과 상관없이 감시합니다.
# 예: extra_goods = ["26014812"]
extra_goods = []
# 직접 지정한 공연의 저가석 기준 가격. 0이면 그 공연의 '가장 싼 등급'만 감시합니다.
extra_max_price = 0

[focus]
# 기간 한정 집중 감시: until 날짜까지는 아래 공연만 취소표를 확인합니다.
# (새 공연 알림은 그대로. until이 지나면 자동으로 전체 감시로 돌아감. 끄려면 until = "")
until = "2026-12-10"
keywords = ["라흐마니노프"]   # 공연명에 들어 있으면 감시
tiers = ["서울시향"]          # 이 분류의 공연은 감시
